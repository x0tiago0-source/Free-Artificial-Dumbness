name: Build Android Release APK

# Gatilho: Executa sempre que houver um 'push' para a branch principal ('main').
on:
  push:
    branches: [ main ]

jobs:
  build_release_apk:
    runs-on: ubuntu-latest # Ambiente de execução Linux.

    steps:
      # Passo 1: Baixar o Código Fonte do GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Passo 2: Configurar o Ambiente de Compilação (JDK 17)
      # Utiliza a versão exata do Java requerida pelo teu projeto.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Passo 3: Configurar Permissões do Gradle Wrapper
      # Garante que o sistema tem permissão para executar os scripts do Gradle.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Passo 4: Compilar o APK de Release
      # Este comando utiliza o Gradle para compilar a aplicação no modo 'release',
      # gerando o ficheiro APK que podes usar.
      - name: Build Release APK
        run: ./gradlew assembleRelease
